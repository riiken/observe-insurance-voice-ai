[project]
name = "observe-insurance-voice-ai"
version = "0.1.0"
description = "VoiceAI claims support agent for Observe Insurance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Async HTTP client for the Google Sheets REST API. Sheets is reached over
    # plain REST rather than google-api-python-client: one dependency instead of
    # a discovery-document stack, and it keeps the transport mockable.
    "httpx>=0.27",
    # Service-account signing for Google Sheets *writes*. An API key can only
    # read, so Integration #2 needs one. Used for the JWT assertion only — the
    # token exchange and every API call go over our own httpx client, which
    # keeps the transport mockable and avoids pulling in `requests`.
    "google-auth>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # The codebase annotates everything; without a checker those annotations
    # are documentation, not a guarantee.
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
# Scoped to app/. Tests use deliberately loose fakes and partial fixtures, and
# type-checking them would trade real signal for noise.
files = ["app"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
