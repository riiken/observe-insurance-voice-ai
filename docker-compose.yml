services:
  api:
    build:
      # Repo root: the image needs backend/app and knowledge/ together.
      context: .
      dockerfile: backend/Dockerfile
    image: observe-insurance-voice-ai:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose runs the container image as deployed, but with readable logs.
      ENVIRONMENT: dev
      LOG_FORMAT: json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
